<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#001e50">
  <title>Cadastro · Concorra a brindes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <style>
    :root {
      --bg: #f2f5f9;
      --card: #ffffff;
      --text: #001e50;
      --muted: #5b6b82;
      --primary: #001e50;
      --primary-dark: #000f2b;
      --accent: #00b0f0;
      --border: #dfe4ec;
      --error: #b91c1c;
      --error-bg: #fef2f2;
      --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #06101f;
        --card: #0d1b30;
        --text: #eef3fa;
        --muted: #9fb0c8;
        --primary: #1f6fd1;
        --primary-dark: #1a5fb4;
        --border: #1e3150;
        --error: #fca5a5;
        --error-bg: #3b1219;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }
    .hero {
      background: linear-gradient(160deg, #000f2b, #001e50 55%, #0a3a8c);
      color: #fff;
      padding: 32px 20px 76px;
      text-align: center;
    }
    .logo {
      display: block;
      margin: 0 auto 18px;
      max-width: min(240px, 70vw);
      max-height: 110px;
      object-fit: contain;
    }
    .logo-texto { font-weight: 800; font-size: 1.1rem; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 14px; }
    .hero h1 { margin: 0 auto; max-width: 420px; font-size: clamp(1.45rem, 6vw, 2rem); line-height: 1.25; }
    main {
      width: 100%;
      max-width: 460px;
      margin: -48px auto 0;
      padding: 0 16px 32px;
      flex: 1;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px 20px;
      box-shadow: 0 10px 30px rgba(0, 30, 80, .14);
      border: 1px solid var(--border);
    }
    label { display: block; font-weight: 600; font-size: .95rem; margin-bottom: 6px; }
    .opt { font-weight: 400; color: var(--muted); }
    .field { margin-bottom: 16px; }
    input[type=text], input[type=tel], input[type=email] {
      width: 100%;
      font: inherit;
      font-size: 16px; /* evita zoom automático no iOS */
      padding: 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: inherit;
      transition: border-color .15s;
    }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 25%, transparent); }
    .check { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; color: var(--muted); margin: 4px 0 20px; }
    .check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--primary); flex-shrink: 0; }
    .check label { font-weight: 400; margin: 0; }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    button {
      width: 100%;
      font: inherit;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      transition: background .15s, transform .05s;
    }
    button:hover { background: var(--primary-dark); }
    button:active { transform: scale(.99); }
    button:disabled { opacity: .6; cursor: wait; }
    .error {
      display: none;
      background: var(--error-bg);
      color: var(--error);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: .92rem;
      margin-bottom: 16px;
    }
    .error.show { display: block; }

    .success { text-align: center; }
    .success h2 { margin: 0 0 4px; font-size: 1.4rem; }
    .success p { margin: 0; color: var(--muted); }
    .ticket {
      margin: 22px auto;
      padding: 22px 16px;
      border: 2px dashed var(--accent);
      border-radius: 14px;
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }
    .ticket small { text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--muted); font-size: .75rem; }
    .ticket .num { font-size: clamp(3rem, 18vw, 4.5rem); font-weight: 800; line-height: 1.1; color: var(--primary); font-variant-numeric: tabular-nums; letter-spacing: .06em; }
    @media (prefers-color-scheme: dark) { .ticket .num { color: #fff; } }
    .hint { font-size: .9rem; }
    .link-btn { background: none; color: var(--primary); font-weight: 600; font-size: .9rem; padding: 10px; margin-top: 12px; }
    .link-btn:hover { background: none; text-decoration: underline; }
    footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 16px 24px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="hero">
    <img class="logo" id="logo" src="/logo.png" alt="Logo da importadora">
    <div class="logo-texto" id="logo-texto" hidden></div>
    <h1>Preencha seu cadastro e concorra a brindes exclusivos</h1>
  </header>

  <main>
    <section class="card" id="form-card">
      <form id="form" novalidate>
        <div class="error" id="erro" role="alert"></div>

        <div class="field">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" autocomplete="name" required maxlength="120" placeholder="Seu nome">
        </div>

        <div class="field">
          <label for="telefone">Telefone / WhatsApp</label>
          <input type="tel" id="telefone" name="telefone" autocomplete="tel-national" inputmode="numeric" required placeholder="(00) 00000-0000">
        </div>

        <div class="field">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" inputmode="numeric" autocomplete="off" required placeholder="000.000.000-00">
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" required maxlength="160" placeholder="voce@email.com">
        </div>

        <div class="hp" aria-hidden="true">
          <label for="site">Não preencha</label>
          <input type="text" id="site" name="site" tabindex="-1" autocomplete="off">
        </div>

        <div class="check">
          <input type="checkbox" id="aceite" name="aceite" required>
          <label for="aceite">Autorizo o uso dos meus dados exclusivamente para participação e contato sobre o sorteio de brindes.</label>
        </div>

        <button type="submit" id="enviar">Enviar</button>
      </form>
    </section>

    <section class="card success" id="sucesso" hidden aria-live="polite">
      <h2 id="sucesso-titulo">Cadastro confirmado!</h2>
      <p id="sucesso-msg">Você já está participando.</p>
      <div class="ticket">
        <small>Seu código</small>
        <div class="num" id="numero">0000</div>
      </div>
      <p class="hint">Tire um print desta tela e guarde seu código: ele será usado no sorteio dos brindes. Boa sorte!</p>
      <button type="button" class="link-btn" id="novo">Cadastrar outra pessoa</button>
    </section>
  </main>

  <footer id="rodape"></footer>

  <script>
    const STORAGE_KEY = 'sorteio-cadastro';
    const $ = (id) => document.getElementById(id);

    function storage(action, value) {
      try {
        if (action === 'get') return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (action === 'set') localStorage.setItem(STORAGE_KEY, JSON.stringify(value));
        if (action === 'del') localStorage.removeItem(STORAGE_KEY);
      } catch { return null; }
    }

    function formatId(id) { return String(id).padStart(4, '0'); }

    function showSuccess({ id, nome, jaCadastrado }) {
      const primeiroNome = (nome || '').split(' ')[0];
      $('sucesso-titulo').textContent = jaCadastrado
        ? `Você já está cadastrado${primeiroNome ? ', ' + primeiroNome : ''}!`
        : `Tudo certo${primeiroNome ? ', ' + primeiroNome : ''}!`;
      $('sucesso-msg').textContent = jaCadastrado
        ? 'Este CPF já estava cadastrado. Seu código continua o mesmo.'
        : 'Seu cadastro foi confirmado e você já está concorrendo aos brindes.';
      $('numero').textContent = formatId(id);
      $('form-card').hidden = true;
      $('sucesso').hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showError(msg) {
      $('erro').textContent = msg;
      $('erro').classList.toggle('show', !!msg);
    }

    function cpfValido(cpf) {
      if (!/^\d{11}$/.test(cpf) || /^(\d)\1{10}$/.test(cpf)) return false;
      for (const len of [9, 10]) {
        let soma = 0;
        for (let i = 0; i < len; i++) soma += Number(cpf[i]) * (len + 1 - i);
        if (((soma * 10) % 11) % 10 !== Number(cpf[len])) return false;
      }
      return true;
    }

    // Máscara de CPF: 000.000.000-00
    $('cpf').addEventListener('input', (e) => {
      const d = e.target.value.replace(/\D/g, '').slice(0, 11);
      e.target.value = d.replace(/^(\d{3})(\d)/, '$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d{1,2})$/, '.$1-$2');
    });

    // Máscara de telefone brasileiro: (00) 00000-0000
    $('telefone').addEventListener('input', (e) => {
      const d = e.target.value.replace(/\D/g, '').slice(0, 11);
      let v = d;
      if (d.length > 2) v = `(${d.slice(0, 2)}) ${d.slice(2)}`;
      if (d.length > 7) v = `(${d.slice(0, 2)}) ${d.slice(2, d.length - 4)}-${d.slice(-4)}`;
      e.target.value = v;
    });

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      showError('');
      const nome = $('nome').value.trim();
      const cpf = $('cpf').value.replace(/\D/g, '');
      const telefone = $('telefone').value.replace(/\D/g, '');
      const email = $('email').value.trim();

      if (nome.split(/\s+/).length < 2) return showError('Informe nome e sobrenome.');
      if (!cpfValido(cpf)) return showError('Informe um CPF válido.');
      if (telefone.length < 10) return showError('Informe um telefone válido com DDD.');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('Informe um e-mail válido.');
      if (!$('aceite').checked) return showError('Marque a autorização para participar.');

      const btn = $('enviar');
      btn.disabled = true;
      btn.textContent = 'Enviando…';
      try {
        const res = await fetch('/api/cadastro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, cpf, telefone, email, aceite: true, site: $('site').value }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.erro || 'Não foi possível concluir o cadastro.');
        storage('set', data);
        showSuccess(data);
      } catch (err) {
        showError(err.message === 'Failed to fetch' ? 'Sem conexão. Verifique sua internet e tente novamente.' : err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar';
      }
    });

    $('novo').addEventListener('click', () => {
      storage('del');
      $('form').reset();
      $('sucesso').hidden = true;
      $('form-card').hidden = false;
      $('nome').focus();
    });

    // Se a pessoa reabrir a página (ou escanear o QR de novo), mostra o código já recebido.
    const salvo = storage('get');
    if (salvo && salvo.id) showSuccess({ ...salvo, jaCadastrado: true });

    // Sem o arquivo public/logo.png, mostra o nome do evento no lugar da logo.
    $('logo').addEventListener('error', () => {
      $('logo').hidden = true;
      $('logo-texto').hidden = false;
    });

    fetch('/api/config').then((r) => r.json()).then(({ evento }) => {
      if (!evento) return;
      $('logo').alt = evento;
      $('logo-texto').textContent = evento;
      document.title = `${evento} · Cadastro`;
      $('rodape').textContent = `${evento} · ${new Date().getFullYear()}`;
    }).catch(() => {});
  </script>
</body>
</html>
