<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1550">
  <title>Cadastro · Concorra a brindes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0b1550;
      --navy-2: #0a1a80;
      --blue: #1b3fc0;
      --label: #0a1a80;
      --input-border: #cfd5df;
      --placeholder: #a7afbd;
      --code-bg: #8aa0ff;
      --ok: #1ee81e;
      --error: #b91c1c;
      --error-bg: #fdecec;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--navy);
      color: #fff;
      min-height: 100dvh;
      line-height: 1.4;
    }
    [hidden] { display: none !important; }

    /* ---------- Tela 1: formulário ---------- */
    .tela-form {
      min-height: 100dvh;
      padding: 56px 16px 48px;
      /* Foto opcional em public/fundo.jpg; sem ela fica só o degradê azul. */
      background:
        linear-gradient(180deg, rgba(27, 63, 192, .55) 0%, rgba(11, 21, 80, .92) 55%, var(--navy) 100%),
        url('/fundo.jpg') center top / cover no-repeat,
        linear-gradient(180deg, var(--blue) 0%, var(--navy) 60%);
    }
    h1 {
      margin: 0 auto 28px;
      text-align: center;
      font-weight: 300;
      font-size: clamp(1.4rem, 5.4vw, 2rem);
      line-height: 1.2;
      max-width: 560px;
    }
    h1 strong { display: block; font-weight: 800; }
    .card {
      background: #fff;
      color: var(--navy);
      max-width: 560px;
      margin: 0 auto;
      border-radius: 18px;
      padding: 20px 18px 22px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .25);
    }
    .grid { display: grid; gap: 14px 24px; }
    @media (min-width: 520px) {
      .card { padding: 22px 24px 24px; }
      .grid { grid-template-columns: 1fr 1fr; }
      .full { grid-column: 1 / -1; }
    }
    label { display: block; font-size: .85rem; font-weight: 700; color: var(--label); margin-bottom: 6px; }
    input[type=text], input[type=tel], input[type=email] {
      width: 100%;
      font: inherit;
      font-size: 16px; /* evita zoom automático no iOS */
      color: var(--navy);
      padding: 10px 12px;
      min-height: 44px;
      border: 1px solid var(--input-border);
      border-radius: 3px;
      background: #fff;
    }
    input::placeholder { color: var(--placeholder); }
    input:focus { outline: none; border-color: var(--navy-2); box-shadow: 0 0 0 3px rgba(10, 26, 128, .15); }
    .check { display: flex; gap: 8px; align-items: flex-start; margin: 16px 0; font-size: .78rem; color: #5b6478; }
    .check input { width: 18px; height: 18px; margin: 0; accent-color: var(--navy-2); flex-shrink: 0; }
    .check label { font-weight: 400; color: inherit; font-size: inherit; margin: 0; }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    button[type=submit] {
      font: inherit;
      font-weight: 700;
      font-size: .95rem;
      color: #fff;
      background: var(--navy-2);
      border: 0;
      border-radius: 3px;
      padding: 12px 28px;
      min-height: 44px;
      cursor: pointer;
    }
    button[type=submit]:hover { background: var(--navy); }
    button[type=submit]:disabled { opacity: .6; cursor: wait; }
    .error {
      display: none;
      background: var(--error-bg);
      color: var(--error);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: .88rem;
      margin-bottom: 14px;
    }
    .error.show { display: block; }

    /* ---------- Tela 2: código ---------- */
    .tela-codigo {
      min-height: 100dvh;
      background: var(--navy);
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
    }
    .resultado {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 0;
    }
    .ok {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--ok);
      display: grid; place-items: center;
      margin-bottom: 18px;
    }
    .resultado h2 { margin: 0 0 22px; font-size: clamp(1.05rem, 4.6vw, 1.4rem); font-weight: 800; letter-spacing: .01em; }
    .codigo {
      width: min(100%, 460px);
      background: var(--code-bg);
      padding: 22px 16px;
      font-weight: 800;
      font-size: clamp(1.8rem, 9vw, 2.4rem);
      letter-spacing: .02em;
      font-variant-numeric: tabular-nums;
    }
    .aviso { margin: 20px 0 0; max-width: 420px; font-size: .9rem; opacity: .8; }
    .aviso.leve { margin-top: 6px; font-size: .82rem; opacity: .65; }
    .novo { margin-top: 18px; background: none; border: 0; color: #fff; opacity: .75; font: inherit; font-size: .85rem; text-decoration: underline; cursor: pointer; padding: 10px; }
  </style>
</head>
<body>
  <main class="tela-form" id="tela-form">
    <h1>Preencha seu cadastro e <strong>concorra a brindes exclusivos</strong></h1>

    <form class="card" id="form" novalidate>
      <div class="error" id="erro" role="alert"></div>
      <div class="grid">
        <div class="full">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" autocomplete="name" required maxlength="120" placeholder="Digite seu nome">
        </div>
        <div>
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" autocomplete="tel-national" inputmode="numeric" required placeholder="Digite seu telefone">
        </div>
        <div>
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" inputmode="numeric" autocomplete="off" required placeholder="Digite seu cpf">
        </div>
        <div class="full">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required maxlength="160" placeholder="Digite seu email">
        </div>
      </div>

      <div class="hp" aria-hidden="true">
        <label for="site">Não preencha</label>
        <input type="text" id="site" name="site" tabindex="-1" autocomplete="off">
      </div>

      <div class="check">
        <input type="checkbox" id="aceite" name="aceite" required>
        <label for="aceite">Autorizo o uso dos meus dados exclusivamente para participação e contato sobre o sorteio de brindes.</label>
      </div>

      <button type="submit" id="enviar">Enviar</button>
    </form>
  </main>

  <main class="tela-codigo" id="tela-codigo" hidden aria-live="polite">
    <div class="resultado">
      <div class="ok" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0b1550" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <h2>SEU CÓDIGO DE PARTICIPAÇÃO</h2>
      <div class="codigo" id="codigo">VW-0000</div>
      <p class="aviso" id="aviso">Tire um print desta tela e guarde seu código para o sorteio.</p>
      <p class="aviso leve">Válido para o sorteio do evento de hoje.</p>
      <button type="button" class="novo" id="novo">Cadastrar outra pessoa</button>
    </div>
  </main>

  <script>
    const STORAGE_KEY = 'sorteio-cadastro';
    const $ = (id) => document.getElementById(id);
    let prefixo = 'VW-';
    let hoje = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date());

    function storage(action, value) {
      try {
        if (action === 'get') return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (action === 'set') localStorage.setItem(STORAGE_KEY, JSON.stringify(value));
        if (action === 'del') localStorage.removeItem(STORAGE_KEY);
      } catch { return null; }
    }

    const formatCodigo = (id) => prefixo + String(id).padStart(4, '0');

    function mostrarCodigo({ id, nome, jaCadastrado }) {
      const primeiroNome = (nome || '').split(' ')[0];
      $('codigo').textContent = formatCodigo(id);
      $('aviso').textContent = jaCadastrado
        ? `${primeiroNome ? primeiroNome + ', você' : 'Você'} já se cadastrou hoje. Seu código continua o mesmo.`
        : `${primeiroNome ? primeiroNome + ', tire' : 'Tire'} um print desta tela e guarde seu código para o sorteio.`;
      $('tela-form').hidden = true;
      $('tela-codigo').hidden = false;
      window.scrollTo(0, 0);
    }

    function showError(msg) {
      $('erro').textContent = msg;
      $('erro').classList.toggle('show', !!msg);
      if (msg) $('erro').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function cpfValido(cpf) {
      if (!/^\d{11}$/.test(cpf) || /^(\d)\1{10}$/.test(cpf)) return false;
      for (const len of [9, 10]) {
        let soma = 0;
        for (let i = 0; i < len; i++) soma += Number(cpf[i]) * (len + 1 - i);
        if (((soma * 10) % 11) % 10 !== Number(cpf[len])) return false;
      }
      return true;
    }

    // Máscara de CPF: 000.000.000-00
    $('cpf').addEventListener('input', (e) => {
      const d = e.target.value.replace(/\D/g, '').slice(0, 11);
      e.target.value = d.replace(/^(\d{3})(\d)/, '$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d{1,2})$/, '.$1-$2');
    });

    // Máscara de telefone brasileiro: (00) 00000-0000
    $('telefone').addEventListener('input', (e) => {
      const d = e.target.value.replace(/\D/g, '').slice(0, 11);
      let v = d;
      if (d.length > 2) v = `(${d.slice(0, 2)}) ${d.slice(2)}`;
      if (d.length > 7) v = `(${d.slice(0, 2)}) ${d.slice(2, d.length - 4)}-${d.slice(-4)}`;
      e.target.value = v;
    });

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      showError('');
      const nome = $('nome').value.trim();
      const telefone = $('telefone').value.replace(/\D/g, '');
      const cpf = $('cpf').value.replace(/\D/g, '');
      const email = $('email').value.trim();

      if (nome.split(/\s+/).length < 2) return showError('Informe nome e sobrenome.');
      if (telefone.length < 10) return showError('Informe um telefone válido com DDD.');
      if (!cpfValido(cpf)) return showError('Informe um CPF válido.');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('Informe um e-mail válido.');
      if (!$('aceite').checked) return showError('Marque a autorização para participar.');

      const btn = $('enviar');
      btn.disabled = true;
      btn.textContent = 'Enviando…';
      try {
        const res = await fetch('/api/cadastro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, cpf, telefone, email, aceite: true, site: $('site').value }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.erro || 'Não foi possível concluir o cadastro.');
        storage('set', data);
        mostrarCodigo(data);
      } catch (err) {
        showError(err.message === 'Failed to fetch' ? 'Sem conexão. Verifique sua internet e tente novamente.' : err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar';
      }
    });

    $('novo').addEventListener('click', () => {
      storage('del');
      $('form').reset();
      $('tela-codigo').hidden = true;
      $('tela-form').hidden = false;
      $('nome').focus();
    });

    function restaurar() {
      // Reabrir a página (ou escanear o QR de novo) no mesmo dia mostra o código já recebido.
      // Em outro dia (outro evento), a pessoa precisa se cadastrar de novo.
      const salvo = storage('get');
      if (salvo && salvo.id && salvo.data_cadastro === hoje) mostrarCodigo({ ...salvo, jaCadastrado: true });
      else if (salvo) storage('del');
    }

    fetch('/api/config').then((r) => r.json()).then((cfg) => {
      if (typeof cfg.prefixo === 'string') prefixo = cfg.prefixo;
      if (cfg.hoje) hoje = cfg.hoje;
      if (cfg.evento) document.title = `${cfg.evento} · Cadastro`;
    }).catch(() => {}).finally(restaurar);
  </script>
</body>
</html>
